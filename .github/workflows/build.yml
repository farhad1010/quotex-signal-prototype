name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q QuotexSignalPrototype_v0.1.zip -d source
          ls -la source
          ls -la source/QuotexSignalPrototype

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: source/QuotexSignalPrototype
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuotexSignalPrototype-debug
          path: source/QuotexSignalPrototype/app/build/outputs/apk/debug/app-debug.apk
